[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "mirrornetv1"
version = "0.1.0"
description = "MirrorNetv1: Ultra-Low Memory Architecture for Resource-Constrained Microcontrollers"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
authors = [
    {name = "Chi-Hsun Chang", email = "chihsunchang1225@gmail.com"}
]

keywords = [
    "mirrornet",
    "mirrorconv",
    "low-memory",
    "operator-fusion",
    "tinyml",
    "esp32",
    "esp32-cam",
    "microcontrollers",
    "edge-ai",
    "lightweight-cnn",
    "computer-vision",
    "pytorch",
]

classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Embedded Systems",
]

dependencies = [
    "torch>=2.0.0",
    "numpy>=1.21.0",
    "MirrorConv @ git+https://github.com/chihsunchang1225-design/MirrorConv.git",
]

[project.urls]
"Homepage" = "https://github.com/chihsunchang1225-design/MirrorNetv1"
"Bug Tracker" = "https://github.com/chihsunchang1225-design/MirrorNetv1/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["mirrornetv1*"]